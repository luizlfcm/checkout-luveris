<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Reabrir upgrade</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,Arial,sans-serif;padding:16px}
.c{max-width:460px;margin:0 auto}h1{font-size:20px;margin:8px 0 4px}p.s{color:#8b95a1;font-size:13px;margin:0 0 16px;line-height:1.5}
label{display:block;font-size:12px;color:#8b95a1;margin:12px 0 4px}
input,select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:16px}
button{background:#238636;border:0;font-weight:700;margin-top:16px;cursor:pointer}button.sec{background:#21262d;margin-top:8px}
.o{margin-top:16px;padding:14px;border-radius:10px;background:#161b22;border:1px solid #30363d;font-size:14px;line-height:1.5;word-break:break-all}
.e{border-color:#da3633;color:#ff7b72}.ok b{color:#3fb950}
</style></head><body><div class="c">
<h1>Reabrir upgrade (Essencial → Completa)</h1>
<p class="s">Para o cliente que perdeu o prazo de 72 h. O preço com crédito volta a valer por mais um período e você recebe o link para mandar.</p>
<label>Senha (ADMIN_KEY)</label><input id="k" type="password" autocomplete="current-password">
<label>Produto</label><select id="p"><option value="fdless">Fábrica da Limpeza Essencial → Premium</option><option value="apess">Fórmula Auto Pro Essencial → Completa</option></select>
<label>E-mail do cliente (o mesmo da compra)</label><input id="e" type="email" inputmode="email" autocapitalize="off">
<label>Prazo, em horas (padrão 72)</label><input id="h" type="number" min="1" max="336" value="72">
<button id="go">Reabrir e gerar link</button>
<div id="out"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
try{$('k').value=localStorage.getItem('adm_k')||''}catch(e){}
function fmt(ms){return new Date(ms).toLocaleString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'})}
$('go').onclick=function(){
  var out=$('out');out.innerHTML='';
  fetch('/api/reabrir-upgrade',{method:'POST',headers:{'content-type':'application/json','x-admin-key':$('k').value},body:JSON.stringify({produto:$('p').value,email:$('e').value,horas:Number($('h').value)||72})})
  .then(function(r){return r.json()}).then(function(d){
    if(!d.ok){out.innerHTML='<div class="o e">'+(d.error||'Erro')+'</div>';return;}
    try{localStorage.setItem('adm_k',$('k').value)}catch(e){}
    var msg='Oi! Reabri pra você o preço do upgrade da '+d.nome+': R$ '+d.preco.toFixed(2).replace('.',',')+' (com o crédito do Essencial), válido até '+fmt(d.expiraEm)+'. Link: '+d.link;
    out.innerHTML='<div class="o ok"><b>Pronto!</b> Preço: R$ '+d.preco.toFixed(2).replace('.',',')+' até '+fmt(d.expiraEm)+'<br><br>'+d.link+'</div><button class="sec" id="c1">Copiar link</button><button class="sec" id="c2">Copiar mensagem pronta</button>';
    $('c1').onclick=function(){navigator.clipboard.writeText(d.link);this.textContent='Copiado ✓'};
    $('c2').onclick=function(){navigator.clipboard.writeText(msg);this.textContent='Copiado ✓'};
  }).catch(function(){out.innerHTML='<div class="o e">Falha de conexão.</div>'});
};
</script></body></html>
